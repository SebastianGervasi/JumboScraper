name: Scraper de Promociones Jumbo

on:
  schedule:
    # Se ejecuta todos los días a las 9:30 AM UTC (6:30 AM hora de Argentina)
    - cron: '30 9 * * *'
  workflow_dispatch: 

jobs:
  scrape-promos-jumbo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # Instalamos Chromium con dependencias del sistema operativo
          playwright install --with-deps chromium

      - name: Ejecutar el Scraper de Jumbo
        run: python scraper_jumbo.py

      - name: Hacer commit y push de los resultados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add promociones_jumbo.md
          
          # Actualiza el repositorio con el archivo de Jumbo
          git commit -m "Actualización automática de promociones bancarias Jumbo" || exit 0
          git push
